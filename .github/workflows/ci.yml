name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Gates the shipped dependency tree. Dev-only advisories are tracked
      # separately in docs/security-hardening.md; see the brace-expansion
      # exception, which has no upstream fix compatible with minimatch v3.
      - run: npm run audit:prod
