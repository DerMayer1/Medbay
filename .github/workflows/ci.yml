name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Gates the shipped dependency tree. Invoked directly rather than through
      # `npm run` so the nested npm audit does not inherit the outer npm
      # invocation. Dev-only advisories are reported but do not fail the build;
      # see docs/security-hardening.md for the accepted exceptions.
      - run: node scripts/audit-production.mjs
